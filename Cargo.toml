[package]
name = "serial_read"
version = "0.1.0"
edition = "2021"

[dependencies]
serialport = "4.6.1"
zerocopy = "0.X"
zerocopy-derive = "0.X"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
strip = true 
opt-level = "z" 
lto = true
codegen-units = 1
panic = "abort"
